name: dfstash

# Postgres data: use a named volume so UID 70 (postgres in alpine) matches the data dir.
# Bind-mounting ./data/postgres fails on many hosts unless you: mkdir -p data/postgres && sudo chown -R 70:70 data/postgres
volumes:
  postgres_data:

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  migrate:
    profiles: ["migrate"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile.migrate
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy

  ocr:
    build:
      context: .
      dockerfile: apps/ocr-core/Dockerfile
    restart: unless-stopped
    environment:
      PORT: "8765"
      CORS_ORIGINS: "*"
    volumes:
      - ./data/ocr-cache:/app/.cache
      - ./data/ocr-debug:/app/debug_stash

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    ports:
      - "${API_PORT:-35467}:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      OCR_ANALYZER_URL: http://ocr:8765/analyze
      CORS_ORIGIN: ${CORS_ORIGIN}
      CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      ocr:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-35466}:80"
    depends_on:
      api:
        condition: service_started
